<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16302D">
<title>Turnos Osvaldo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.90.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: barra superior con locación + semana, pestañas, y una grilla de trabajo que scrollea sola en horizontal */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16302D; --muted:#5D706C; --line:#D5DDDA;
  --accent:#0F6B5F; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --lunch:#FBE3D3; --lunch-ink:#7A3B12; --dinner:#E1E3F7; --dinner-ink:#2C3274;
  --off:#E6F4F7; --off-ink:#3F7581; --warn:#B4231A; --warn-soft:#FBE4E1; --alta:#C7651B;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --surface:#162321; --ink:#E4ECEA; --muted:#93A7A2; --line:#2A3B38;
  --accent:#4FC2AE; --accent-ink:#06201C; --accent-soft:#18332F;
  --lunch:#3A2618; --lunch-ink:#F6C49F; --dinner:#232846; --dinner-ink:#C3C8F5;
  --off:#15292D; --off-ink:#86C1CD; --warn:#FF8A7E; --warn-soft:#3A1C19; --alta:#F2A15E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1817; --surface:#162321; --ink:#E4ECEA; --muted:#93A7A2; --line:#2A3B38;
  --accent:#4FC2AE; --accent-ink:#06201C; --accent-soft:#18332F;
  --lunch:#3A2618; --lunch-ink:#F6C49F; --dinner:#232846; --dinner-ink:#C3C8F5;
  --off:#15292D; --off-ink:#86C1CD; --warn:#FF8A7E; --warn-soft:#3A1C19; --alta:#F2A15E; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1680px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav strong{font-family:var(--f-display);font-weight:600;font-size:1.05rem;min-width:13ch;text-align:center}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--warn);border-color:var(--warn)}
button.ghost{border-color:transparent;background:transparent}
button.icon{padding:6px 10px}
a.btnlink{display:inline-block;text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:6px 12px}
a.btnlink.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
select,input[type=text],input[type=time],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.locs{display:flex;gap:6px;flex-wrap:wrap}
.locs button{border-radius:999px;padding:5px 14px}
.locs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.bar .group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
thead th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Grilla de planificación */
.plan th.puesto,.plan td.puesto{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;border-right:1px solid var(--line)}
.plan td.puesto{font-weight:500}
.plan td.puesto small{display:block;color:var(--muted);font-weight:400}
.plan .area td{background:var(--bg);font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px}
.plan .area td.puesto{background:var(--bg)}
.plan th.day{text-align:center;border-left:1px solid var(--line)}
.plan th.day .tag{display:inline-block;margin-left:4px;font-size:.65rem;padding:0 5px;border-radius:4px;background:var(--line);color:var(--ink)}
.plan th.day .tag.alta{background:var(--alta);color:#fff}
.plan th.sub{text-align:center;font-size:.68rem}
.plan td.cell{min-width:104px;padding:4px;border-left:1px solid var(--line)}
.plan td.cell.a{background:color-mix(in srgb,var(--lunch) 35%,var(--surface))}
.plan td.cell.c{background:color-mix(in srgb,var(--dinner) 35%,var(--surface))}
.plan td.cell.first{border-left:1px solid var(--muted)}
.chip{display:block;width:100%;text-align:left;border-radius:6px;padding:3px 6px;margin-bottom:3px;border:1px solid transparent;font-size:.8rem;line-height:1.25}
.chip.a{background:var(--lunch);color:var(--lunch-ink)}
.chip.c{background:var(--dinner);color:var(--dinner-ink)}
.chip b{display:block;font-weight:600}
.chip .mono{font-size:.72rem}
.chip.conflict{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.add{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:2px;font-size:.8rem;border-radius:6px}
.add:hover{color:var(--accent);border-color:var(--accent)}
.count td{font-size:.75rem;color:var(--muted);text-align:center;background:var(--bg)}
.count td.puesto{text-align:left}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
.panel h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.conflicts{margin:0;padding-left:18px;color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}

/* Vista del equipo / imagen */
.team th,.team td{text-align:center;white-space:nowrap}
.team td.w{font-size:.82rem}
.team td.w small{display:block;color:inherit;opacity:.75;font-size:.72rem}
.team td.a.w{background:var(--lunch);color:var(--lunch-ink)}
.team td.c.w{background:var(--dinner);color:var(--dinner-ink)}
.team td.off{background:var(--off);color:var(--off-ink);font-weight:600;font-size:.78rem}
.team td.else{background:var(--line);color:var(--muted);font-size:.75rem}
img{max-width:100%}
[hidden]{display:none!important}
main{min-width:0}
/* Planificar: la semana entera entra en una pantalla de compu */
.plan{table-layout:fixed;min-width:860px}
.plan th.puesto,.plan td.puesto{width:118px;min-width:0;font-size:.8rem;padding:4px 6px}
.plan th.day{font-size:.68rem;letter-spacing:.03em;padding:4px 2px}
.plan th.day .tag{font-size:.58rem;margin-left:2px;padding:0 3px}
.plan th.sub{font-size:.6rem;letter-spacing:.02em;padding:3px 1px}
.plan td.cell{min-width:0;padding:2px}
.plan .chip{padding:2px 4px;margin-bottom:2px;font-size:.72rem;line-height:1.15}
.plan .chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .chip .mono{font-size:.64rem}
.plan .add{padding:0;font-size:.7rem;line-height:1.3}
.plan .falta{font-size:.6rem;margin-bottom:1px}
.plan .notebtn{font-size:.64rem;padding:2px 3px}
.plan .count td{font-size:.68rem;padding:3px 2px}
main > section{grid-template-columns:minmax(0,1fr)}
.team td.pc{padding:0}
.tcell{display:block;width:100%;min-height:42px;border:none;border-radius:0;background:transparent;color:inherit;padding:6px 8px;font:inherit;text-align:center}
.tcell small{display:block;opacity:.75;font-size:.72rem}
body:not(.ro) .tcell:hover{outline:2px solid var(--accent);outline-offset:-2px}
body.ro .tcell{cursor:default}
.team td.day{font-family:var(--f-display);font-weight:600;text-align:left}
.preview img{border:1px solid var(--line);border-radius:8px;display:block}

/* Equipo */
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.person.inactive{opacity:.55}
.person .name{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.todo{background:var(--warn-soft);color:var(--warn)}
.checks{display:grid;gap:10px}
.checks fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 14px}
.checks legend{font-size:.78rem;color:var(--muted);padding:0 4px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{display:grid;gap:3px;font-size:.78rem;color:var(--muted);flex:1 1 160px}
.puestos-list{display:grid;gap:6px}
.puestos-list .row input[type=text]{flex:1 1 140px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:12px;padding:18px;width:min(440px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0}
.modal label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:30}

/* Calendario semanal */
.cal{display:grid;grid-template-columns:repeat(7,minmax(168px,1fr));gap:8px;min-width:0}
.calday{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;align-content:start;gap:8px;padding:10px;min-width:0}
.calday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.calday header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.calday header strong{font-family:var(--f-display);font-weight:600;font-size:1rem}
.calday header .tag{font-size:.65rem;padding:0 5px;border-radius:4px;background:var(--line)}
.calday header .tag.alta{background:var(--alta);color:#fff}
.calloc{display:grid;gap:4px}
.calloc h4{margin:0;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px}
.calturn{display:grid;gap:3px}
.calturn > span{font-size:.7rem;color:var(--muted)}
.calturn .chip small{display:block;opacity:.8;font-size:.7rem}
.calturn .none{font-size:.75rem;color:var(--muted);font-style:italic}
.libres{font-size:.75rem;color:var(--off-ink);background:var(--off);border-radius:6px;padding:4px 6px}
@media (max-width:760px){.cal{grid-template-columns:1fr}}
@media (min-width:761px){.calwrap{overflow-x:auto}}
/* Avisos, cobertura y notas */
:root{--amber:#8A5A00;--amber-soft:#FFF0CF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--amber:#F4C46A;--amber-soft:#33270F}}
:root[data-theme="dark"]{--amber:#F4C46A;--amber-soft:#33270F}
.chip.tired{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.plan td.cell.short{outline:2px dashed var(--amber);outline-offset:-3px}
.falta{display:block;font-size:.68rem;color:var(--amber);font-weight:600;margin-bottom:2px}
.notes td{background:var(--amber-soft);vertical-align:top}
.notes td.puesto{color:var(--amber);font-weight:700}
.notebtn{width:100%;text-align:left;border:1px dashed var(--amber);background:transparent;color:var(--amber);font-size:.72rem;padding:3px 5px;border-radius:6px;white-space:normal;line-height:1.25}
.notebtn.has{border:1px solid var(--amber);background:var(--surface);color:var(--ink);font-weight:500}
.notebtn .rs{display:block;font-weight:700;color:var(--amber)}
.team td.nov{background:var(--amber-soft);padding:0;min-width:180px;white-space:normal;text-align:left}
.team td.nov .notebtn{border:none;border-radius:0;min-height:42px;background:transparent}
.plusmark{color:var(--amber);font-weight:700}
details.avisos{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
details.avisos summary{cursor:pointer;font-weight:600}
.avisos ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
.avisos li.red{color:var(--warn)}
.avisos li.amber{color:var(--amber)}
.tnote{font-size:.8rem;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:6px;padding:6px 8px;white-space:pre-line;display:grid;gap:3px}
.tnote b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--amber)}
.tnote .resp{font-weight:700}
.tnote .resp.me{color:var(--warn)}
.tnote ul{margin:2px 0 0;padding-left:16px}
.calturn .falta{margin:0}
.ausentes{font-size:.75rem;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:4px 6px}
.team td.aus{background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:.75rem}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px;resize:vertical;width:100%}
.calday header .tag,.plan th.day .tag{max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px;width:5.5em;font:inherit;color:inherit}
.cob input[type=number]{width:4em}
.list{display:grid;gap:6px}
.item{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.item.past{opacity:.55}
.pill.vac{background:var(--amber-soft);color:var(--amber)}
.diff-pos{color:var(--warn)}
.diff-neg{color:var(--accent)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 24px}
.kpis div{display:grid}
.kpis b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpis span{font-size:.75rem;color:var(--muted)}

/* Mi horario */
.miweek{display:grid;gap:8px}
.miday{display:grid;grid-template-columns:120px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.miday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.miday .d{font-family:var(--f-display);font-weight:600}
.miday .d small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted)}
.miturns{display:grid;gap:6px;min-width:0}
.miturn{border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.miturn.a{background:var(--lunch);color:var(--lunch-ink)}
.miturn.c{background:var(--dinner);color:var(--dinner-ink)}
.miturn .t{font-family:var(--f-mono);font-size:1rem;font-weight:500}
.miturn .tnote{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.milibre{color:var(--off-ink);background:var(--off);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.85rem}
.miaus{color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.85rem}
body.solo nav.tabs{display:none}
body.kiosk .weeknav{visibility:hidden}
/* Fichero */
.fbox{max-width:440px;margin:0 auto;width:100%;display:grid;gap:12px}
.fbox input{font-size:1.4rem;padding:10px 12px;letter-spacing:.06em;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:inherit;font-family:var(--f-mono)}
.fclock{font-family:var(--f-mono);font-size:2.6rem;font-weight:500;text-align:center;margin:0}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtns button{font-size:1.2rem;padding:16px 10px;border-radius:12px;font-weight:700}
.fres{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fres.ok{background:var(--off);color:var(--off-ink)}
.fres.err{background:var(--warn-soft,#FDE2E2);color:var(--warn)}
.fres .big{font-size:1.15rem;font-weight:700}
.fres ul{margin:0;padding-left:18px;font-size:.85rem}
.fst{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.fst.ok{background:var(--off);color:var(--off-ink)}
.fst.late,.fst.miss{background:var(--amber-soft);color:var(--amber)}
.fst.bad{background:#FDE2E2;color:var(--warn)}
.fichtag{font-size:.65rem;color:var(--accent);font-weight:700;display:block}
.cxform{min-width:0}
.cxform label{display:grid;gap:4px;min-width:0}
.cxform select,.cxform textarea{width:100%;min-width:0;max-width:100%}
.cxform .row label{flex:1 1 120px}
.cxform input[type=time]{width:100%}
.pill.acc{background:var(--off);color:var(--off-ink)}
@media (max-width:520px){.miday{grid-template-columns:1fr}}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist ul{list-style:none;margin:0;padding:0}
.hist time{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .who{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chip,button{transition:border-color .15s,background .15s}}
body.ro [data-editonly]{display:none}
.auth{display:flex;align-items:center;gap:8px}
.auth .hint{max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .err{color:var(--warn);font-size:.85rem;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Turnos Osvaldo</h1><span id="sync">Cargando…</span></div>
    <div class="weeknav">
      <button class="icon" id="prevW" aria-label="Semana anterior">‹</button>
      <strong id="weekLabel"></strong>
      <button class="icon" id="nextW" aria-label="Semana siguiente">›</button>
      <button id="todayW">Hoy</button>
    </div>
    <div class="auth" id="authBox"></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="semana" hidden>Planificar semana</button>

<div id="toast" class="toast" hidden></div>

<script>
const APP_URL=location.origin+location.pathname;
/* Niveles: personal (sin usuario), encargado y administrador */
const BASE_VIEWS=["calendario","mi","cambios","fichar"],ENC_VIEWS=[...BASE_VIEWS,"semana","equipo"];
function canSee(v){return S.isAdmin||(S.canWrite?ENC_VIEWS:BASE_VIEWS).includes(v)}
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DSH=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const TURNOS=[{k:"a",name:"Almuerzo"},{k:"c",name:"Cena"}];
const TNAME={a:"Almuerzo",c:"Cena"};
const TIPOS={vac:"Vacaciones",lic:"Licencia",franco:"Franco pedido"};
const VIEWS=["semana","calendario","equipo","mi","cambios","ausencias","personas","horas","fichadas","aprobar","ajustes","historial","fichar"];
const DEFAULT_CONFIG={
  locations:[
    {id:"norte",name:"Barrio Norte",puestos:[
      {id:"jefe",name:"Jefe de cocina",area:"Cocina"},{id:"segundo",name:"Segundo de cocina",area:"Cocina"},
      {id:"cocineros",name:"Cocineros",area:"Cocina"},{id:"bacha",name:"Cocinero y bacha",area:"Cocina"},
      {id:"enc-salon",name:"Encargado de salón",area:"Salón"},{id:"mozo1",name:"Mozo 1",area:"Salón"},
      {id:"mozo2",name:"Mozo 2",area:"Salón"},{id:"mozo3",name:"Mozo 3",area:"Salón"}]},
    {id:"prod",name:"Producción",puestos:[
      {id:"enc-prod",name:"Encargada de producción",area:"Producción"},{id:"coc1",name:"Cocinero 1",area:"Producción"},
      {id:"coc2",name:"Cocinero 2",area:"Producción"},{id:"coc3",name:"Cocinero 3",area:"Producción"}]}
  ],
  cierres:{},entradas:{a:"11:30",c:"19:30"},cobertura:{},reglas:{descanso:10,maxSemana:48},valorHora:{},especiales:{}
};
const DEFAULT_CIERRE=[["15:00","23:59"],["15:00","23:59"],["15:00","23:59"],["15:00","23:59"],["15:30","00:30"],["15:30","00:30"],["16:00","23:59"]];

const S={db:null,session:null,canWrite:false,isAdmin:false,role:"",editores:[],me:"",live:false,config:structuredClone(DEFAULT_CONFIG),staff:[],weeks:{},ausencias:[],plantillas:[],hist:{},
  view:"semana",loc:"norte",calLoc:"all",week:mondayOf(new Date()),hours:{preset:"semana"},editing:null,confirm:"",miId:"",solo:false,fich:[],accesos:{},demoAcc:{},sol:[],cx:{dni:"",sid:"",mis:[],sel:"",tipo:"ceder",para:"",paraSel:"",nin:"",nout:"",motivo:"",busy:false}};

/* ---------- utilidades ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return iso(x)}
function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtDM(s){const d=parseISO(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
function toMin(t){if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m}
function hhmm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function shortT(t){return t&&t.endsWith(":00")?String(Number(t.slice(0,2))):t?String(Number(t.slice(0,2)))+":"+t.slice(3):""}
function fmtH(h){return (Math.round(h*10)/10).toLocaleString("es-AR")}
function money(n){return "$ "+Math.round(n).toLocaleString("es-AR")}
function loc(id){return S.config.locations.find(l=>l.id===id)}
function puesto(l,p){return loc(l)?.puestos.find(x=>x.id===p)}
function person(id){return S.staff.find(s=>s.id===id)}
function pname(id){return person(id)?.name||"(persona borrada)"}
function cierre(l,d,t){const c=S.config.cierres?.[l]?.[d];return c?(t==="a"?c[0]:c[1]):DEFAULT_CIERRE[d][t==="a"?0:1]}
function espVal(v){return typeof v==="string"?{n:v,f:/feriado/i.test(v)}:{n:v?.n||"",f:!!v?.f}}
function especial(w,d){const v=S.config.especiales?.[addDays(w,d)];return v?espVal(v).n:""}
function esFeriado(date){const v=S.config.especiales?.[date];return !!v&&espVal(v).f}
/* Domingo al mediodía y feriados se pagan con recargo */
function plusPay(w,a){return (a.d===6&&a.t==="a")||esFeriado(addDays(w,a.d))}
function recargo(){return Number(S.config.recargo)||0}
function occupant(a,w){return weekAssign(w||S.week).find(x=>x.id!==a.id&&x.loc===a.loc&&x.p===a.p&&x.d===a.d&&x.t===a.t)}
function isAlta(w,d){return d>=4||!!especial(w,d)}
function dayTag(w,d){const e=especial(w,d);return e?`<span class="tag alta" title="${esc(e)}">${esc(e)}</span>`:`<span class="tag ${d>=4?"alta":""}">${d>=4?"alta":"baja"}</span>`}
function interval(a){
  const start=toMin(a.in)??toMin(S.config.entradas?.[a.t]||"11:30");
  let end=toMin(a.out||cierre(a.loc,a.d,a.t));
  if(!a.out&&end===23*60+59)end=1440;
  if(end<=start)end+=1440;
  return [start,end];
}
function hoursOf(a){const [s,e]=interval(a);return (e-s)/60}
/* Fichadas: la hora llega del servidor y se lee en hora de Argentina */
const TZ="America/Argentina/Buenos_Aires";
const _tf=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function arParts(at){const p=Object.fromEntries(_tf.formatToParts(new Date(at)).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,min:+p.hour*60+ +p.minute,hm:`${p.hour}:${p.minute}`}}
function dayDiff(a,b){return Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/864e5)}
function fichBy(sid){if(S._fbV!==S.fich){S._fbV=S.fich;S._fb={};for(const f of S.fich){f._p??=arParts(f.at);(S._fb[f.staff_id]??=[]).push(f)}}return S._fb[sid]||[]}
/* Entrada: la primera marca desde 3 h antes del turno. Salida: la última hasta 4 h después del cierre. */
function fichOf(a,w){const date=addDays(w,a.d),[s,e]=interval(a);let fin=null,fout=null;
  for(const f of fichBy(a.s)){const dd=dayDiff(f._p.date,date);if(dd<-1||dd>2)continue;const m=dd*1440+f._p.min;
    if(f.tipo==="in"&&m>=s-180&&m<e-30&&(!fin||m<fin.m))fin={m,hm:f._p.hm,id:f.id};
    if(f.tipo==="out"&&m>s&&m<=e+240&&(!fout||m>fout.m))fout={m,hm:f._p.hm,id:f.id}}
  if(fin&&fout&&fout.m<=fin.m)fout=null;
  return {in:fin?.hm||"",out:fout?.hm||"",inM:fin?.m,inId:fin?.id,outId:fout?.id}}
function realOf(a,w){const f=w?fichOf(a,w):{};return {in:a.realIn||f.in||"",out:a.realOut||f.out||"",fin:!a.realIn&&!!f.in,fout:!a.realOut&&!!f.out}}
function realHours(a,w){const r=realOf(a,w);if(!r.in||!r.out)return null;let s=toMin(r.in),e=toMin(r.out);if(e<=s)e+=1440;return (e-s)/60}
function rate(a){return Number(S.config.valorHora?.[a.loc+":"+a.p])||0}
function weekAssign(w){return S.weeks[w]?.assign||[]}
function weekNotas(w){return S.weeks[w]?.notas||{}}
function weekResp(w){return S.weeks[w]?.resp||{}}
function ausente(sid,date){return S.ausencias.find(x=>x.s===sid&&x.from<=date&&date<=x.to)}
function toast(msg,ms=2600){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function sortedStaff(){return [...S.staff].sort((a,b)=>a.name.localeCompare(b.name,"es"))}
function shortName(n){const w=n.trim().split(/\s+/);return w.length>1?w[0]+" "+w[1][0]+".":n}
function shiftLabel(a){return `${shortT(a.in)} a ${a.out?shortT(a.out)+"hs":"cierre"}`}
function dname(day){return day<0?DAYS[day+7].toLowerCase()+" anterior":DAYS[day].toLowerCase()}

/* ---------- avisos: superposición, ausencias, descanso, tope semanal, cobertura ---------- */
function avisosFor(w){
  const list=weekAssign(w),red=new Set(),amber=new Set(),msgs=[],short=new Map();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const x=list[i],y=list[j];if(x.s!==y.s||x.d!==y.d)continue;
    const [a1,a2]=interval(x),[b1,b2]=interval(y);
    if(a1<b2&&b1<a2){red.add(x.id);red.add(y.id);
      msgs.push({lvl:"red",text:`${pname(x.s)} el ${DAYS[x.d].toLowerCase()} está en ${loc(x.loc)?.name} (${puesto(x.loc,x.p)?.name||"?"}, ${x.in}) y en ${loc(y.loc)?.name} (${puesto(y.loc,y.p)?.name||"?"}, ${y.in}) a la vez.`})}
  }
  const slot={};for(const a of list)(slot[`${a.loc}|${a.p}|${a.d}|${a.t}`]??=[]).push(a);
  for(const arr of Object.values(slot))if(arr.length>1){const a=arr[0];arr.forEach(x=>red.add(x.id));
    msgs.push({lvl:"red",text:`${arr.map(x=>pname(x.s)).join(" y ")} están en el mismo puesto (${puesto(a.loc,a.p)?.name||"?"}, ${loc(a.loc)?.name||""}) el ${DAYS[a.d].toLowerCase()} ${TNAME[a.t].toLowerCase()}. Dejá una sola persona.`})}
  for(const a of list){const au=ausente(a.s,addDays(w,a.d));
    if(au){red.add(a.id);msgs.push({lvl:"red",text:`${pname(a.s)} tiene ${TIPOS[au.tipo].toLowerCase()} el ${DAYS[a.d].toLowerCase()}, pero está asignado en ${loc(a.loc)?.name||""} (${TNAME[a.t].toLowerCase()}).`})}}
  const R=S.config.reglas||{},desc=Number(R.descanso)||0,max=Number(R.maxSemana)||0;
  const by={};
  for(const a of weekAssign(addDays(w,-7)))(by[a.s]??=[]).push({...a,_off:-7});
  for(const a of list)(by[a.s]??=[]).push({...a,_off:0});
  for(const [sid,arr] of Object.entries(by)){
    const iv=arr.map(a=>{const [s,e]=interval(a);const day=a.d+a._off;return {a,day,s:day*1440+s,e:day*1440+e}}).sort((x,y)=>x.s-y.s);
    if(desc)for(let i=1;i<iv.length;i++){const p=iv[i-1],n=iv[i];
      if(n.a._off!==0||n.day===p.day)continue;const gap=n.s-p.e;
      if(gap>=0&&gap<desc*60){amber.add(n.a.id);msgs.push({lvl:"amber",text:`${pname(sid)} sale el ${dname(p.day)} ${p.e%1440===0?"a la medianoche":"a las "+hhmm(p.e)} y entra el ${dname(n.day)} a las ${hhmm(n.s)}: descansa ${fmtH(gap/60)} h (mínimo ${desc} h).`})}}
    const tot=iv.filter(x=>x.a._off===0).reduce((s,x)=>s+(x.e-x.s)/60,0);
    if(max&&tot>max)msgs.push({lvl:"amber",text:`${pname(sid)} tiene ${fmtH(tot)} h esta semana (tope ${max} h).`});
  }
  const cob=S.config.cobertura||{};
  for(const L of S.config.locations)for(let d=0;d<7;d++)for(const t of ["a","c"]){
    const falt=[];
    for(const p of L.puestos){const req=Number(cob[L.id+":"+p.id]?.[(isAlta(w,d)?"a":"b")+t])||0;if(!req)continue;
      const n=list.filter(a=>a.loc===L.id&&a.p===p.id&&a.d===d&&a.t===t).length;
      if(n<req){short.set(`${L.id}|${p.id}|${d}|${t}`,req-n);falt.push((req-n>1?(req-n)+" × ":"")+p.name)}}
    if(falt.length)msgs.push({lvl:"amber",kind:"cob",loc:L.id,d,t,text:`${DAYS[d]} ${TNAME[t].toLowerCase()} en ${L.name}: falta ${falt.join(", ")}.`});
  }
  return {red,amber,msgs,short};
}

/* ---------- guardado ---------- */
const queues={};
/* Los datos viven en Supabase, en una tabla "docs" (path → JSON). Los valores hora van aparte, en privado/costos, que solo ven los editores. */
const cache=new Map();
function persist(path,body){
  if(!S.db)return Promise.resolve();
  let writes=[[path,body]];
  if(path==="config/main"){const {valorHora,recargo,...rest}=body;writes=[["config/main",rest],["privado/costos",{valorHora:valorHora||{},recargo:Number(recargo)||0}]]}
  writes.forEach(([p,b])=>cache.set(p,structuredClone(b)));
  queues[path]=(queues[path]||Promise.resolve()).then(async()=>{
    const {error}=await S.db.from("docs").upsert(writes.map(([p,b])=>({path:p,data:b,updated_at:new Date().toISOString()})));
    if(error)throw error;
  }).catch(e=>showBanner("No se pudo guardar el último cambio ("+(e?.message||"sin conexión")+"). Revisá tu conexión e intentá de nuevo."));
  return queues[path];
}
function saveWeek(w){const body={assign:weekAssign(w),notas:weekNotas(w),resp:weekResp(w),updatedAt:new Date().toISOString()};S.weeks[w]=body;return persist("weeks/"+w,body)}
function saveConfig(){return persist("config/main",S.config)}
async function setAcceso(sid,dni){
  if(!S.db){if(Object.entries(S.demoAcc).some(([k,v])=>k!==sid&&v.dni===dni))return "Ese DNI ya lo tiene otra persona";S.demoAcc[sid]={dni};S.accesos[sid]={dni};return ""}
  const {error}=await S.db.rpc("set_acceso",{p_staff:sid,p_dni:dni});
  if(error)return /set_acceso|schema cache|function/.test(error.message)?"Falta correr cambios.sql en Supabase.":error.message;
  await loadFichero();return ""}
async function delAcceso(sid){
  if(!S.db){delete S.demoAcc[sid];delete S.accesos[sid];return ""}
  const {error}=await S.db.from("accesos").delete().eq("staff_id",sid);if(error)return error.message;await loadFichero();return ""}
async function loadFichero(){
  if(!S.db||!S.isAdmin){S.fich=[];S.accesos={};S.sol=[];S.editores=[];return}
  const {data:eds}=await S.db.from("editores").select("email,rol").order("email");S.editores=eds||[];
  const since=new Date(Date.now()-120*864e5).toISOString();let all=[];
  for(let i=0;;i+=1000){const {data,error}=await S.db.from("fichadas").select("id,staff_id,tipo,at,origen,por").gte("at",since).order("at").range(i,i+999);if(error||!data)break;all=all.concat(data);if(data.length<1000)break}
  S.fich=all;
  const {data:acc}=await S.db.from("accesos").select("staff_id,dni,bloqueado_hasta");
  S.accesos=Object.fromEntries((acc||[]).map(x=>[x.staff_id,x]));
  const {data:sol}=await S.db.from("solicitudes").select("*").order("created_at",{ascending:false}).limit(300);
  S.sol=sol||[];
}
async function addFichadaManual(sid,tipo,at){
  if(!S.db){S.fich=[...S.fich,{id:uid(),staff_id:sid,tipo,at,origen:"manual",por:S.me||"prueba"}].sort((a,b)=>a.at.localeCompare(b.at));render();toast("Marca cargada");return}
  const {data,error}=await S.db.from("fichadas").insert({staff_id:sid,tipo,at,origen:"manual",por:S.me}).select("id,staff_id,tipo,at,origen,por").single();
  if(error){toast("No se pudo cargar la marca: "+error.message);return}
  if(!S.fich.some(f=>f.id===data.id))S.fich=[...S.fich,data].sort((a,b)=>a.at.localeCompare(b.at));
  log(`Cargó a mano una ${tipo==="in"?"entrada":"salida"} de ${pname(sid)} (${fmtDM(arParts(at).date)} ${arParts(at).hm}).`);render();toast("Marca cargada")}
async function delFichada(id){
  const f=S.fich.find(x=>String(x.id)===String(id));S.fich=S.fich.filter(x=>String(x.id)!==String(id));render();
  if(!S.db||!f)return;const {error}=await S.db.from("fichadas").delete().eq("id",f.id);
  if(error){toast("No se pudo borrar la marca.");await loadFichero();render();return}
  log(`Borró una ${f.tipo==="in"?"entrada":"salida"} de ${pname(f.staff_id)} (${fmtDM(arParts(f.at).date)} ${arParts(f.at).hm}).`)}
function saveStaff(p){S.staff=S.staff.filter(x=>x.id!==p.id).concat(p);const {id,...body}=p;return persist("staff/"+id,body)}
function removeDoc(coll,id){if(!S.db)return;cache.delete(coll+"/"+id);S.db.from("docs").delete().eq("path",coll+"/"+id).then(({error})=>{if(error)showBanner("No se pudo borrar. Intentá de nuevo.")})}
function showBanner(msg){const b=document.getElementById("banner");b.textContent=msg;b.hidden=!msg}
function log(text){
  if(!S.db)return;
  const m=iso(new Date()).slice(0,7),now=new Date().toISOString();
  const items=[...(S.hist[m]?.items||[])];
  if(items[0]&&items[0].text===text&&items[0].by===S.me&&Date.now()-Date.parse(items[0].at)<120000)items[0]={...items[0],at:now};
  else items.unshift({at:now,by:S.me,text});
  S.hist[m]={items:items.slice(0,400)};persist("historial/"+m,S.hist[m]);
}
function whenTxt(w,a){return `${DSH[a.d]} ${fmtDM(addDays(w,a.d))} ${TNAME[a.t].toLowerCase()}`}

/* ---------- vistas ---------- */
function render(){
  // Sin permiso de edición se muestra el calendario, pero se recuerda la pestaña pedida para cuando termine de ingresar.
  const view=canSee(S.view)?S.view:"calendario";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.hidden=!canSee(b.dataset.view));
  document.body.classList.toggle("solo",S.solo);document.body.classList.toggle("kiosk",view==="fichar");document.body.classList.toggle("ro",!S.canWrite);renderAuth();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  document.getElementById("weekLabel").textContent=fmtDM(S.week)+" – "+fmtDM(addDays(S.week,6));
  // En la pantalla para fichar no se redibuja, para no borrar lo que la persona está escribiendo.
  if(view==="fichar"&&document.getElementById("fDni")){renderModal();return}
  const m=document.getElementById("main");
  m.innerHTML=({semana:viewSemana,calendario:viewCalendario,equipo:viewEquipo,mi:viewMi,ausencias:viewAusencias,personas:viewPersonas,horas:viewHoras,fichadas:viewFichadas,cambios:viewCambios,aprobar:viewAprobar,fichar:viewFichar,ajustes:viewAjustes,historial:viewHistorial})[view]();
  if(view==="equipo")drawPreview();
  const ab=document.querySelector('nav.tabs [data-view="aprobar"]'),np=S.sol.filter(x=>x.estado==="pendiente").length;if(ab)ab.textContent="Aprobación de cambios"+(np?` (${np})`:"");
  renderModal();
}
function locButtons(){return `<div class="locs">${S.config.locations.map(l=>`<button data-loc="${l.id}" aria-pressed="${l.id===S.loc}">${esc(l.name)}</button>`).join("")}</div>`}
function avisosPanel(msgs){
  if(!msgs.length)return "";
  const r=msgs.filter(m=>m.lvl==="red"),a=msgs.filter(m=>m.lvl==="amber");
  return `<details class="avisos" ${r.length||msgs.length<=6?"open":""}><summary>Avisos de la semana: ${r.length?`<span style="color:var(--warn)">${r.length} para corregir</span>`:""}${r.length&&a.length?" · ":""}${a.length?`<span style="color:var(--amber)">${a.length} para revisar</span>`:""}</summary>
    <ul>${[...r,...a].map(m=>`<li class="${m.lvl}">${esc(m.text)}</li>`).join("")}</ul></details>`;
}
function chipClass(a,av){return av.red.has(a.id)?"conflict":av.amber.has(a.id)?"tired":""}

function viewSemana(){
  const L=loc(S.loc);if(!L)return "";
  const list=weekAssign(S.week).filter(a=>a.loc===S.loc),notas=weekNotas(S.week);
  const av=avisosFor(S.week);
  const areas=[...new Set(L.puestos.map(p=>p.area))];
  let head1=`<tr><th class="puesto" rowspan="2">Puesto</th>`,head2="<tr>";
  for(let d=0;d<7;d++){
    head1+=`<th class="day" colspan="2">${DSH[d]} ${fmtDM(addDays(S.week,d))} ${dayTag(S.week,d)}</th>`;

function noteLines(n){return (n||"").split("\n").map(s=>s.trim()).filter(Boolean).map(l=>l.replace(/^[-•*]\s*/,""))}
function noteHTML(n,rid,me){const lines=noteLines(n);if(!lines.length&&!rid)return "";
  return `<div class="tnote">${rid?`<div class="resp ${rid===me?"me":""}">${rid===me?"Sos responsable de este turno":"Responsable: "+esc(pname(rid))}</div>`:""}${lines.length?`<b>Novedades del turno</b>${lines.length>1?`<ul>${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:esc(lines[0])}`:""}</div>`}
/* Botón de novedades: editable para editores, solo texto para el resto */
function noteBtn(k){const n=weekNotas(S.week)[k]||"",r=weekResp(S.week)[k]||"";
  const inner=`${r?`<span class="rs">Resp.: ${esc(shortName(pname(r)))}</span>`:""}${n?esc(n.length>70?n.slice(0,70)+"…":n):r?"":"+ novedad"}`;
  return S.canWrite?`<button class="notebtn ${n||r?"has":""}" data-nota="${k}">${inner}</button>`:(n||r?`<div class="notebtn has">${inner}</div>`:"")}
function viewCalendario(){

        ${cobMsg?`<span class="falta">${esc(cobMsg.text.split(": ")[1])}</span>`:""}</div>`}).join("")}</div>`).join("");

      ${aus.length?`<div class="ausentes">${aus.map(p=>`<b>${esc(TIPOS[ausente(p.id,date).tipo])}:</b> ${esc(p.name)}`).join("<br>")}</div>`:""}

  return `<section style="display:grid;gap:12px">

}

function teamCols(l,w){
  const list=weekAssign(w);
  const ids=new Set(S.staff.filter(s=>s.active!==false&&s.loc===l).map(s=>s.id));
  list.filter(a=>a.loc===l).forEach(a=>ids.add(a.s));
  return sortedStaff().filter(s=>ids.has(s.id));
}
function teamCell(sid,l,d,t,w){
  const mine=weekAssign(w).filter(a=>a.s===sid&&a.d===d&&a.t===t);
  const here=mine.filter(a=>a.loc===l);
  if(here.length){const a=here[0];return {kind:"w",text:shiftLabel(a),sub:[puesto(a.loc,a.p)?.name,a.note].filter(Boolean).join(" · ")}}
  if(mine.length)return {kind:"else",text:loc(mine[0].loc)?.name||"",sub:""};
  const au=ausente(sid,addDays(w,d));
  if(au)return {kind:"aus",text:TIPOS[au.tipo].toUpperCase(),sub:""};
  return {kind:"off",text:"OFF",sub:""};
}

/* Mi horario: lo que ve cada persona, con las notas y tareas de sus turnos */
function miDays(id,w){
  return DAYS.map((n,d)=>{
    const date=addDays(w,d);
    const mine=weekAssign(w).filter(a=>a.s===id&&a.d===d).sort((a,b)=>a.t.localeCompare(b.t)||(a.in||"").localeCompare(b.in||""));
    return {d,date,n,mine,au:ausente(id,date),notas:weekNotas(w),resp:weekResp(w)};
  });
}

function fichMsg(r,tipo){
  if(!r.ok)return `<div class="fres err"><span class="big">${r.error==="red"?"No hay conexión":"No encontramos ese DNI"}</span>${r.error==="red"?"Probá de nuevo en un momento. La marca no quedó registrada.":"Revisá los números. Si está bien, pedile a tu encargado que lo cargue."}</div>`;
  const P=arParts(r.at),date=P.date,w=mondayOf(new Date(date+"T12:00:00")),d=dayDiff(date,w);
  const hoy=weekAssign(w).filter(a=>a.s===r.staff_id&&a.d===d).sort((a,b)=>a.t.localeCompare(b.t));
  const prev=(r.recientes||[])[1];let warn="";
  if(prev&&!r.repetida&&prev.tipo===tipo){const pp=arParts(prev.at);warn=`<div>Ojo: tu marca anterior también fue una ${tipo==="in"?"entrada":"salida"} (${pp.date===date?"hoy":fmtDM(pp.date)} a las ${pp.hm}). Si te olvidaste de marcar la ${tipo==="in"?"salida":"entrada"}, avisale a tu encargado.</div>`}
  return `<div class="fres ok"><span class="big">Hola ${esc(pname(r.staff_id).split(" ")[0])}. ${tipo==="in"?"Entrada":"Salida"} ${r.repetida?"ya registrada":"registrada"} a las ${P.hm}.</span>${warn}
    ${hoy.length?`<div><b>Hoy:</b> ${hoy.map(a=>`${TNAME[a.t]} ${shortT(a.in)} a ${a.out?shortT(a.out):"cierre"} · ${esc(loc(a.loc)?.name||"")} · ${esc(puesto(a.loc,a.p)?.name||"")}`).join("; ")}</div>${hoy.map(a=>noteHTML(weekNotas(w)[`${a.loc}|${a.d}|${a.t}`],weekResp(w)[`${a.loc}|${a.d}|${a.t}`],r.staff_id)).join("")}`:`<div>Hoy no tenés turno cargado.</div>`}
    <div><b>Tus últimas marcas:</b><ul>${(r.recientes||[]).slice(0,5).map(f=>{const p=arParts(f.at);return `<li>${p.date===date?"Hoy":fmtDM(p.date)} ${p.hm} · ${f.tipo==="in"?"Entrada":"Salida"}</li>`}).join("")}</ul></div></div>`;
}
function demoSid(dni){return Object.keys(S.demoAcc).find(k=>S.demoAcc[k].dni===dni)||""}
function demoFichar(dni,tipo){
  const sid=demoSid(dni);if(!sid)return {ok:false,error:"datos"};
  const last=S.fich.filter(f=>f.staff_id===sid).at(-1);const now=new Date().toISOString();let rep=false;
  if(last&&last.tipo===tipo&&Date.now()-Date.parse(last.at)<120000)rep=true;else S.fich=[...S.fich,{id:uid(),staff_id:sid,tipo,at:now,origen:"persona"}];
  return {ok:true,staff_id:sid,tipo,at:rep?last.at:now,repetida:rep,recientes:S.fich.filter(f=>f.staff_id===sid).slice(-8).reverse()}}
async function doFichar(tipo){
  const dni=(document.getElementById("fDni").value||"").replace(/\D/g,""),rem=document.getElementById("fRem").checked,box=document.getElementById("fRes");
  if(!dni){toast("Escribí tu DNI.");return}
  try{rem?localStorage.setItem("fichar-dni",dni):localStorage.removeItem("fichar-dni")}catch{}
  document.querySelectorAll("[data-fichar]").forEach(b=>b.disabled=true);box.innerHTML=`<p class="hint">Registrando…</p>`;
  let r;
  if(S.db){const {data,error}=await S.db.rpc("fichar",{p_dni:dni,p_tipo:tipo});r=error?{ok:false,error:"red"}:data}
  else r=demoFichar(dni,tipo);
  document.querySelectorAll("[data-fichar]").forEach(b=>b.disabled=false);
  box.innerHTML=fichMsg(r,tipo);
  if(r.ok){if(!rem)document.getElementById("fDni").value="";
    clearTimeout(doFichar._t);doFichar._t=setTimeout(()=>{const b=document.getElementById("fRes");if(b)b.innerHTML=""},25000)}
}
setInterval(()=>{const c=document.getElementById("fClock");if(c)c.textContent=arParts(Date.now()).hm},5000);

/* ---------- Cambios de turno ---------- */
const CTIPO={ceder:"Que lo haga un compañero",cambio:"Intercambiarlo con un compañero",horario:"Cambiar el horario"};
const CEST={pendiente:"Pendiente",aprobada:"Aprobado",rechazada:"Rechazado",cancelada:"Cancelado"};
function shiftTxt(w,a){return `${DSH[a.d]} ${fmtDM(addDays(w,a.d))} ${TNAME[a.t].toLowerCase()} · ${puesto(a.loc,a.p)?.name||""} (${loc(a.loc)?.name||""}) · ${shiftLabel(a)}`}
/* Turnos de una persona desde hoy y por tres semanas */
function proximos(sid){const today=iso(new Date()),out=[];
  for(const [w,doc] of Object.entries(S.weeks)){if(addDays(w,6)<today||w>addDays(today,21))continue;
    for(const a of doc.assign||[])if(a.s===sid&&addDays(w,a.d)>=today)out.push({w,a,key:w+"|"+a.id})}
  return out.sort((x,y)=>(addDays(x.w,x.a.d)+x.a.t).localeCompare(addDays(y.w,y.a.d)+y.a.t))}
function findShift(key){const [w,id]=(key||"").split("|");const a=weekAssign(w).find(x=>x.id===id);return a?{w,a}:null}

/* Aviso por mail al encargado (FormSubmit: la primera vez llega un mail para activarlo) */
function avisoEmail(){return (S.config.avisoEmail||"").trim()}
/* Dos formas: un email (vía FormSubmit) o el link de un script de Google que manda el mail desde tu Gmail (ver supabase/aviso-gmail.gs). */
async function enviarAviso(asunto,campos){const to=avisoEmail();if(!to)return {ok:false,msg:"no hay email cargado"};
  const body=JSON.stringify({_subject:asunto,_template:"table",_captcha:"false",...campos});
  if(/^https:\/\/script\.google\.com\//.test(to)){
    try{await fetch(to,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body});return {ok:true,msg:"Mail enviado por Gmail. Revisá tu bandeja."}}
    catch(e){return {ok:false,msg:"no se pudo conectar con Google ("+(e?.message||"error")+")"}}}
  try{const r=await fetch("https://formsubmit.co/ajax/"+to.replace(/[^\w.@+-]/g,""),{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body});
    let j={};try{j=await r.json()}catch{}
    if(r.ok&&String(j.success)!=="false")return {ok:true,msg:"Mail enviado. Si es la primera vez, revisá tu correo para activarlo."};
    return {ok:false,msg:"FormSubmit respondió: "+(j.message||("error "+r.status))}}
  catch(e){return {ok:false,msg:"el navegador no pudo conectarse con FormSubmit ("+(e?.message||"error")+"). Probá con la opción de Gmail."}}}

/* Aprobación de cambios (encargados) */
function solCheck(x){
  const A=weekAssign(x.semana).find(a=>a.id===x.assign_id);
  if(!A||A.s!==x.staff_id)return {err:"El turno cambió desde que se pidió (lo movieron o lo borraron). Rechazalo y, si hace falta, hacelo a mano."};
  const warns=[];let B=null;
  if(x.tipo==="cambio"){B=weekAssign(x.para_semana).find(a=>a.id===x.para_assign_id);if(!B||B.s!==x.para_staff)return {err:`El turno de ${pname(x.para_staff)} cambió desde que se pidió.`}}
  const chk=(sid,w,a,skip)=>{const au=ausente(sid,addDays(w,a.d));if(au)warns.push(`${pname(sid)} tiene ${TIPOS[au.tipo].toLowerCase()} el ${DAYS[a.d].toLowerCase()} ${fmtDM(addDays(w,a.d))}.`);
    const other=weekAssign(w).filter(o=>o.s===sid&&o.d===a.d&&o.id!==a.id&&!skip.includes(o.id)).filter(o=>{const [p1,p2]=interval(a),[q1,q2]=interval(o);return p1<q2&&q1<p2});
    if(other.length)warns.push(`${pname(sid)} ya trabaja en ese horario (${other.map(o=>shiftTxt(w,o)).join("; ")}).`);
    if(!(person(sid)?.puestos||[]).includes(a.loc+":"+a.p))warns.push(`${pname(sid)} no tiene ${puesto(a.loc,a.p)?.name||"ese puesto"} en su ficha.`)};
  if(x.tipo==="ceder")chk(x.para_staff,x.semana,A,[]);
  if(x.tipo==="cambio"){chk(x.para_staff,x.semana,A,[B.id]);chk(x.staff_id,x.para_semana,B,[A.id])}
  return {A,B,warns}}

async function resolver(id,ok){
  const x=S.sol.find(s=>String(s.id)===String(id));if(!x)return;const resp=(document.getElementById("resp-"+id)?.value||"").trim();
  if(ok){const c=solCheck(x);if(c.err){toast(c.err);return}
    const strip=({realIn,realOut,...a})=>a;
    if(x.tipo==="ceder")setWeek(x.semana,weekAssign(x.semana).map(a=>a.id===c.A.id?strip({...a,s:x.para_staff}):a));
    if(x.tipo==="horario")setWeek(x.semana,weekAssign(x.semana).map(a=>a.id===c.A.id?{...a,in:x.nuevo_in,out:x.nuevo_out||""}:a));
    if(x.tipo==="cambio"){const swap=a=>a.id===c.A.id?strip({...a,s:x.para_staff}):a.id===c.B.id?strip({...a,s:x.staff_id}):a;
      setWeek(x.semana,weekAssign(x.semana).map(swap));if(x.para_semana!==x.semana)setWeek(x.para_semana,weekAssign(x.para_semana).map(swap))}
  }
  const upd={estado:ok?"aprobada":"rechazada",respuesta:resp||null,resuelto_por:S.me||"encargado",resuelto_at:new Date().toISOString()};
  Object.assign(x,upd);render();
  if(S.db){const {error}=await S.db.from("solicitudes").update(upd).eq("id",x.id);if(error){toast("No se pudo guardar la respuesta: "+error.message);return}}
  log(`${ok?"Aprobó":"Rechazó"} un pedido de cambio: ${x.resumen||""}`);toast(ok?"Aprobado: el calendario ya está actualizado":"Pedido rechazado")}

/* Fichadas de la semana para los encargados */
const TOL=5;
function viewFichadas(){
  const w=S.week,now=Date.now(),today=iso(new Date()),nowP=arParts(now);
  const list=weekAssign(w).slice().sort((a,b)=>a.d-b.d||a.t.localeCompare(b.t)||a.loc.localeCompare(b.loc)||(a.in||"").localeCompare(b.in||""));
  const used=new Set();
  const rows=list.map(a=>{const f=fichOf(a,w),date=addDays(w,a.d),[s,e]=interval(a);f.inId&&used.add(f.inId);f.outId&&used.add(f.outId);
    const nowM=dayDiff(nowP.date,date)*1440+nowP.min;let st;
    if(a.realIn||a.realOut)st=["ok","Corregido a mano"];
    else if(!f.in)st=nowM>s+15?["bad","No fichó"]:["","Todavía no"];
    else if(f.inM>s+TOL)st=["late",`Tarde ${f.inM-s} min`];
    else if(!f.out)st=nowM>e+240?["miss","Sin salida"]:["ok","Trabajando"];
    else st=["ok","Bien"];
    return `<tr><td>${DSH[a.d]} ${fmtDM(date)} · ${TNAME[a.t]}</td><td><b>${esc(pname(a.s))}</b></td><td>${esc(loc(a.loc)?.name||"")} · ${esc(puesto(a.loc,a.p)?.name||"")}</td><td class="mono">${esc(a.in)}–${esc(a.out||cierre(a.loc,a.d,a.t))}</td><td class="mono">${f.in||"–"}</td><td class="mono">${f.out||"–"}</td><td>${st[1]?`<span class="fst ${st[0]}">${st[1]}</span>`:""}</td></tr>`}).join("");
  const wf=S.fich.filter(f=>{f._p??=arParts(f.at);return f._p.date>=w&&f._p.date<=addDays(w,6)}).sort((a,b)=>b.at.localeCompare(a.at));
  const sueltas=wf.filter(f=>!used.has(f.id));
  const people=sortedStaff().filter(p=>p.active!==false),sin=people.filter(p=>!S.accesos[p.id]);
  const fl=f=>`<div class="item"><span><span class="mono">${fmtDM(f._p.date)} ${f._p.hm}</span> · <b>${esc(pname(f.staff_id))}</b> · ${f.tipo==="in"?"Entrada":"Salida"}${f.origen==="manual"?` <span class="hint">· a mano${f.por?" por "+esc(f.por):""}</span>`:""}</span><button class="ghost danger" data-fdel="${f.id}">${S.confirm==="fdel-"+f.id?"¿Borrar? Tocá de nuevo":"Borrar"}</button></div>`;
  return `<section style="display:grid;gap:12px">
    <div class="panel"><h2>Pantalla para fichar</h2>
      <p class="hint">Cada persona pone su DNI y toca Entrada o Salida. Sirve en su celular o en una tablet fija en el local. El DNI se carga en Personas y puestos.</p>
      <div class="row"><a class="btnlink primary" href="#fichar" target="_blank" rel="noopener">Abrir pantalla para fichar</a><button id="fichLink">Copiar link</button></div>
      ${sin.length?`<p class="hint">Sin DNI cargado todavía: ${sin.map(p=>esc(p.name)).join(", ")}.</p>`:`<p class="hint">Todas las personas activas tienen el DNI cargado.</p>`}
    </div>
    <div class="panel"><h2>Turnos de la semana ${fmtDM(w)} – ${fmtDM(addDays(w,6))}</h2>
      <p class="hint">Tarde = entró más de ${TOL} minutos después del horario. Lo fichado completa las horas reales en Horas y costos.</p>
      ${list.length?`<div class="scroll"><table><thead><tr><th>Turno</th><th>Persona</th><th>Lugar</th><th>Planificado</th><th>Entró</th><th>Salió</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="hint">Esta semana no tiene turnos cargados.</p>`}
    </div>
    <div class="grid2">
      <div class="panel"><h2>Cargar una marca a mano</h2>
        <p class="hint">Para cuando alguien se olvidó de fichar. Queda registrado quién la cargó.</p>
        <div class="row"><label>Persona<select id="fmP"><option value="">Elegí</option>${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
          <label>Marca<select id="fmT"><option value="in">Entrada</option><option value="out">Salida</option></select></label></div>
        <div class="row"><label>Fecha<input type="date" id="fmD" value="${today}"></label><label>Hora<input type="time" id="fmH"></label><button class="primary" id="fmAdd" style="align-self:end">Agregar</button></div>
      </div>
      <div class="panel"><h2>Marcas de la semana <span class="hint">· ${wf.length}</span></h2>
        ${sueltas.length?`<p class="hint" style="color:var(--amber)">${sueltas.length} ${sueltas.length>1?"marcas no coinciden":"marca no coincide"} con ningún turno: ${sueltas.slice(0,6).map(f=>`${esc(shortName(pname(f.staff_id)))} ${DSH[dayDiff(f._p.date,w)]??""} ${f._p.hm}`).join(", ")}.</p>`:""}
        ${wf.length?`<div class="list">${wf.map(fl).join("")}</div>`:`<p class="hint">Todavía no hay marcas esta semana.</p>`}

    </div></div>`).join("");

function hoursRange(){
  const h=S.hours,today=new Date();
  if(h.preset==="semana")return [S.week,addDays(S.week,6)];
  if(h.preset==="semana-ant")return [addDays(S.week,-7),addDays(S.week,-1)];
  if(h.preset==="mes"){const a=new Date(today.getFullYear(),today.getMonth(),1),b=new Date(today.getFullYear(),today.getMonth()+1,0);return [iso(a),iso(b)]}
  if(h.preset==="mes-ant"){const a=new Date(today.getFullYear(),today.getMonth()-1,1),b=new Date(today.getFullYear(),today.getMonth(),0);return [iso(a),iso(b)]}
  return [h.from||S.week,h.to||addDays(S.week,6)];
}
function hoursData(){
  const [from,to]=hoursRange();const rows={},byLoc={},pt={};const today=iso(new Date());
  for(const [w,doc] of Object.entries(S.weeks))for(const a of doc.assign||[]){
    const date=addDays(w,a.d);if(date<from||date>to)continue;
    const r=rows[a.s]??={plan:0,real:0,realPlan:0,fichados:0,pend:0,turnos:0,cost:0,plus:0,byPuesto:{},days:{}};
    const h=hoursOf(a),rh=realHours(a,w),use=rh??h,pl=plusPay(w,a),c=use*rate(a)*(pl?1+recargo()/100:1);
    r.plan+=h;r.turnos++;r.cost+=c;if(pl)r.plus+=use;
    if(rh!=null){r.real+=rh;r.realPlan+=h;r.fichados++}else if(date<today)r.pend++;
    const key=a.loc+":"+a.p;r.byPuesto[key]=(r.byPuesto[key]||0)+use;
    pt[key]??={h:0,cost:0};pt[key].h+=use;pt[key].cost+=c;
    byLoc[a.loc]??={h:0,cost:0};byLoc[a.loc].h+=use;byLoc[a.loc].cost+=c;
    (r.days[date]??=new Set()).add(a.t);
  }
  for(const r of Object.values(rows)){r.dobles=Object.values(r.days).filter(s=>s.size===2).length;r.dias=Object.keys(r.days).length}
  return {from,to,rows,byLoc,pt};
}

      ${wk.length?`<div class="scroll"><table><thead><tr><th>Día</th><th>Persona</th><th>Lugar</th><th>Planificado</th><th>Entró</th><th>Salió</th></tr></thead><tbody>

        ${(()=>{const r=realOf(a,S.week);return `<td><input type="time" id="ri-${a.id}" data-real="${a.id}|realIn" value="${esc(r.in)}" aria-label="Entrada real">${r.fin?`<span class="fichtag">fichó</span>`:""}</td><td><input type="time" id="ro-${a.id}" data-real="${a.id}|realOut" value="${esc(r.out)}" aria-label="Salida real">${r.fout?`<span class="fichtag">fichó</span>`:""}</td>`})()}</tr>`).join("")}

/* ---------- imágenes ---------- */
const FONT=(w,s)=>`${w} ${s}px 'IBM Plex Sans', system-ui, sans-serif`;
function buildCanvas(){
  const l=S.loc,w=S.week,L=loc(l),cols=teamCols(l,w);
  const sc=2,dayW=120,turW=96,colW=150,ciW=124,rowH=46,headH=40,titleH=64;
  const W=Math.max(dayW+turW+cols.length*colW+ciW,560),gridH=titleH+headH+14*rowH;
  const cv=document.createElement("canvas");const g=cv.getContext("2d");
  const nov=novBlocks(g,l,w,W-32);const H=gridH+(nov.h?nov.h+24:0);
  cv.width=W*sc;cv.height=H*sc;g.scale(sc,sc);
  const C={bg:"#FFFFFF",head:"#16302D",headInk:"#FFFFFF",lunch:"#F7C4AE",dinner:"#FBDDBF",off:"#BDEBF2",offInk:"#1E5F6B",else:"#E2D6F3",elseInk:"#4B3A72",aus:"#FFE3A3",ausInk:"#7A4E00",ink:"#16302D",dayA:"#E9EEEC",alta:"#C7651B"};
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  g.fillStyle=C.ink;g.textBaseline="middle";
  g.font="800 24px 'Bricolage Grotesque', system-ui, sans-serif";g.fillText(L.name.toUpperCase(),16,titleH/2-6);
  g.font=FONT(500,14);g.fillStyle="#5D706C";
  g.fillText(`Semana del ${fmtDM(w)} al ${fmtDM(addDays(w,6))}`,16,titleH/2+18);
  const heads=["DÍA","TURNO",...cols.map(s=>s.name.toUpperCase()),"CIERRE COCINA"];
  const widths=[dayW,turW,...cols.map(()=>colW),ciW];
  let x=0;g.fillStyle=C.head;g.fillRect(0,titleH,W,headH);
  g.fillStyle=C.headInk;g.font=FONT(600,13);g.textAlign="center";
  heads.forEach((h,i)=>{g.fillText(fit(g,h,widths[i]-8),x+widths[i]/2,titleH+headH/2);x+=widths[i]});
  for(let d=0;d<7;d++)for(const [ti,t] of ["a","c"].entries()){
    const y=titleH+headH+(d*2+ti)*rowH;x=0;
    const fillCell=(wd,color)=>{g.fillStyle=color;g.fillRect(x,y,wd,rowH)};
    if(ti===0){g.fillStyle=d%2?"#FFFFFF":C.dayA;g.fillRect(x,y,dayW,rowH*2);g.fillStyle=C.ink;g.textAlign="left";g.font=FONT(700,14);g.fillText(DAYS[d].toUpperCase(),10,y+rowH-6);
      const e=especial(w,d);g.font=FONT(500,11);g.fillStyle=isAlta(w,d)?C.alta:"#5D706C";g.fillText(fit(g,fmtDM(addDays(w,d))+(e?" · "+e:isAlta(w,d)?" · alta":""),dayW-14),10,y+rowH+10)}
    x+=dayW;fillCell(turW,d%2?"#FFFFFF":C.dayA);g.fillStyle=C.ink;g.textAlign="center";g.font=FONT(600,13);g.fillText(ti?"CENA":"ALMUERZO",x+turW/2,y+rowH/2);x+=turW;
    for(const s of cols){
      const c=teamCell(s.id,l,d,t,w);
      fillCell(colW,c.kind==="w"?(t==="a"?C.lunch:C.dinner):c.kind==="off"?C.off:c.kind==="aus"?C.aus:C.else);
      g.fillStyle=c.kind==="off"?C.offInk:c.kind==="else"?C.elseInk:c.kind==="aus"?C.ausInk:C.ink;g.textAlign="center";
      if(c.sub){g.font=FONT(600,13);g.fillText(fit(g,c.text,colW-8),x+colW/2,y+rowH/2-8);g.font=FONT(400,11);g.fillText(fit(g,c.sub,colW-8),x+colW/2,y+rowH/2+10)}
      else{g.font=FONT(c.kind==="off"||c.kind==="aus"?700:500,c.kind==="aus"?11:13);g.fillText(fit(g,c.text,colW-8),x+colW/2,y+rowH/2)}
      x+=colW;
    }
    fillCell(ciW,d%2?"#FFFFFF":C.dayA);g.fillStyle=C.ink;g.font="500 13px 'IBM Plex Mono', ui-monospace, monospace";g.fillText(shortT(cierre(l,d,t))+" HS",x+ciW/2,y+rowH/2);
  }
  g.strokeStyle="#FFFFFF";g.lineWidth=2;
  for(let r=0;r<=14;r++){const y=titleH+headH+r*rowH;g.beginPath();g.moveTo(r%2?dayW:0,y);g.lineTo(W,y);g.stroke()}
  x=0;for(const wd of widths){x+=wd;g.beginPath();g.moveTo(x,titleH);g.lineTo(x,gridH);g.stroke()}
  if(nov.h)drawNov(g,nov,16,gridH+16,W-32);
  return cv;
}
/* Novedades y responsables de una locación, para dibujar en las imágenes */
function novItems(l,w){const n=weekNotas(w),r=weekResp(w),out=[];
  for(let d=0;d<7;d++)for(const t of ["a","c"]){const k=`${l}|${d}|${t}`,lines=noteLines(n[k]);if(!lines.length&&!r[k])continue;
    out.push({title:`${DAYS[d]} ${fmtDM(addDays(w,d))} · ${TNAME[t]}`,resp:r[k]?pname(r[k]):"",lines})}
  return out}
function novBlocks(g,l,w,max){const items=novItems(l,w);if(!items.length)return {h:0,rows:[]};
  const rows=[[FONT(800,16),"NOVEDADES DE LA SEMANA","#8A5A00"]];
  for(const it of items){rows.push([FONT(700,14),it.title+(it.resp?" · Responsable: "+it.resp:""),"#16302D"]);
    for(const s of it.lines){g.font=FONT(400,13);wrap(g,"• "+s,max-16).forEach(x=>rows.push([FONT(400,13),x,"#16302D"]))}}
  return {h:rows.length*20+16,rows}}
function drawNov(g,nov,x,y,w){g.fillStyle="#FFF0CF";g.fillRect(x-8,y-6,w+16,nov.h);g.fillStyle="#8A5A00";g.fillRect(x-8,y-6,5,nov.h);
  g.textAlign="left";g.textBaseline="top";nov.rows.forEach(([f,t,c],i)=>{g.font=f;g.fillStyle=c;g.fillText(t,x+4,y+4+i*20)})}
function wrap(g,text,max){const out=[];for(const para of String(text).split("\n")){let line="";for(const word of para.split(/\s+/)){const t=line?line+" "+word:word;if(g.measureText(t).width>max&&line){out.push(line);line=word}else line=t}if(line)out.push(line)}return out}
/* Imagen de Mi horario: una fila por día, con turnos y notas del turno */
function buildPersonCanvas(id){
  const w=S.week,days=miDays(id,w),sc=2,W=640,dayW=130,pad0=14,inner=W-dayW-pad0*2;
  const cv=document.createElement("canvas");const g=cv.getContext("2d");
  const blocks=days.map(x=>{
    const items=[];
    if(x.au)items.push({kind:"aus",lines:[[FONT(700,14),TIPOS[x.au.tipo]+(x.au.nota?" · "+x.au.nota:"")]]});
    for(const a of x.mine){
      const lines=[[FONT(700,15),`${TNAME[a.t]}: ${a.in} a ${a.out||"cierre ("+cierre(a.loc,a.d,a.t)+")"}`],[FONT(400,13),`${loc(a.loc)?.name||""} · ${puesto(a.loc,a.p)?.name||""}`]];
      const k=`${a.loc}|${a.d}|${a.t}`,rid=x.resp[k];
      if(rid)lines.push([FONT(700,13),rid===id?"★ Sos responsable de este turno":"Responsable: "+pname(rid)]);
      const nl=noteLines(x.notas[k]);if(nl.length)lines.push([FONT(700,12),"NOVEDADES DEL TURNO"]);
      for(const l of nl)lines.push([FONT(400,13),"• "+l]);
      if(a.note)lines.push([FONT(600,13),"Para vos: "+a.note]);
      items.push({kind:a.t,lines});
    }
    if(!items.length)items.push({kind:"off",lines:[[FONT(700,14),"Libre"]]});
    return {x,items};
  });
  const LH=19;let H=78;
  const layout=blocks.map(b=>{let h=12;b.items.forEach(it=>{it.wrapped=it.lines.flatMap(([f,t])=>{g.font=f;return wrap(g,t,inner-20).map(s=>[f,s])});it.h=it.wrapped.length*LH+12;h+=it.h+6});return Math.max(h+6,52)});
  H+=layout.reduce((s,h)=>s+h,0)+10;
  cv.width=W*sc;cv.height=H*sc;g.scale(sc,sc);
  g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);g.textBaseline="top";g.textAlign="left";
  g.fillStyle="#16302D";g.font="800 24px 'Bricolage Grotesque', system-ui, sans-serif";g.fillText(pname(id),pad0,16);
  g.font=FONT(500,14);g.fillStyle="#5D706C";g.fillText(`Mi horario · semana del ${fmtDM(w)} al ${fmtDM(addDays(w,6))}`,pad0,48);
  let y=78;const col={a:["#F7C4AE","#16302D"],c:["#FBDDBF","#16302D"],off:["#BDEBF2","#1E5F6B"],aus:["#FFE3A3","#7A4E00"]};
  blocks.forEach((b,i)=>{
    g.fillStyle=i%2?"#FFFFFF":"#E9EEEC";g.fillRect(0,y,W,layout[i]);
    g.fillStyle="#16302D";g.font=FONT(700,14);g.fillText(b.x.n.toUpperCase(),pad0,y+12);
    g.font=FONT(500,12);g.fillStyle=isAlta(w,b.x.d)?"#C7651B":"#5D706C";g.fillText(fit(g,fmtDM(b.x.date)+(especial(w,b.x.d)?" · "+especial(w,b.x.d):""),dayW-pad0-4),pad0,y+32);
    let yy=y+8;
    for(const it of b.items){const [bg,ink]=col[it.kind];g.fillStyle=bg;g.fillRect(dayW,yy,inner+pad0,it.h);g.fillStyle=ink;
      it.wrapped.forEach(([f,t],k)=>{g.font=f;g.fillText(t,dayW+10,yy+6+k*LH)});yy+=it.h+6}
    y+=layout[i];
  });
  return cv;
}
/* Imagen del calendario: un bloque por día, almuerzo y cena lado a lado, con novedades */
function buildCalCanvas(){
  const w=S.week,sc=2,W=820,pad=16,colW=(W-pad*2-12)/2,LH=18;
  const locs=S.config.locations.filter(l=>S.calLoc==="all"||l.id===S.calLoc);

  const list=weekAssign(w),n=weekNotas(w),r=weekResp(w);
  const days=[];

    for(const L of locs){const cols=["a","c"].map(t=>{const rows=[];const k=`${L.id}|${d}|${t}`;
        if(r[k])rows.push([FONT(700,13),"Responsable: "+pname(r[k]),"#8A5A00"]);
        for(const s of noteLines(n[k])){g.font=FONT(500,12);wrap(g,"• "+s,colW-20).forEach(x=>rows.push([FONT(500,12),x,"#8A5A00"]))}
        const here=list.filter(a=>a.loc===L.id&&a.d===d&&a.t===t).sort((a,b)=>(a.in||"").localeCompare(b.in||""));
        for(const a of here)rows.push([FONT(600,13),fitW(g,FONT(600,13),`${pname(a.s)} · ${puesto(a.loc,a.p)?.name||""} · ${shortT(a.in)}–${a.out?shortT(a.out):"cierre"}`,colW-20),"#16302D"]);
        if(!here.length)rows.push([FONT(400,13),"Sin personal","#5D706C"]);
        return {t,rows}});
      const bh=22+Math.max(...cols.map(c=>c.rows.length))*LH+6,h=(locs.length>1?20:4)+bh+8;secs.push({L,cols,h,bh})}
    days.push({d,secs,h:30+secs.reduce((s,x)=>s+x.h,0)+8})}
  const titleH=70,H=titleH+days.reduce((s,x)=>s+x.h,0)+8;
  cv.width=W*sc;cv.height=H*sc;g.scale(sc,sc);
  g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);g.textBaseline="top";g.textAlign="left";
  g.fillStyle="#16302D";g.font="800 24px 'Bricolage Grotesque', system-ui, sans-serif";g.fillText(locs.length===1?locs[0].name.toUpperCase():"OSVALDO · CALENDARIO",pad,16);
  g.font=FONT(500,14);g.fillStyle="#5D706C";g.fillText(`Semana del ${fmtDM(w)} al ${fmtDM(addDays(w,6))}`,pad,48);
  let y=titleH;

    let yy=y+30;
    for(const s of D.secs){
      if(locs.length>1){g.fillStyle="#5D706C";g.font=FONT(700,12);g.fillText(s.L.name.toUpperCase(),pad,yy+4)}
      s.cols.forEach((c,i)=>{const x=pad+i*(colW+12),top=yy+(locs.length>1?20:4);
        g.fillStyle=c.t==="a"?"#F7C4AE":"#FBDDBF";g.fillRect(x,top,colW,s.bh);
        g.fillStyle="#16302D";g.font=FONT(700,12);g.fillText(`${TNAME[c.t].toUpperCase()} · CIERRE ${shortT(cierre(s.L.id,D.d,c.t))}${c.t==="a"&&plusPay(w,{d:D.d,t:"a"})?" · $+":""}`,x+8,top+4);
        c.rows.forEach(([f,t,col],k)=>{g.font=f;g.fillStyle=col;g.fillText(t,x+8,top+22+k*LH)})});
      yy+=s.h}
    y+=D.h}
  return cv;
}

/* ---------- Excel ---------- */
function sheetName(s){return s.replace(/[\\/?*\[\]:]/g," ").slice(0,31)}
function addSheet(wb,name,rows,widths){const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,sheetName(name))}
function buildWorkbook(){
  const w=S.week,wb=XLSX.utils.book_new(),notas=weekNotas(w),resp=weekResp(w);
  const nv=k=>(notas[k]||"").replace(/\n/g," · "),rn=k=>resp[k]?pname(resp[k]):"";
  if(S.view==="calendario"){
    const cal=[[`Calendario · semana del ${fmtDM(w)} al ${fmtDM(addDays(w,6))}`],[],["Día","Fecha","Locación","Turno","Cierre","Responsable","Novedades del turno","Personal"]];
    for(let d=0;d<7;d++)for(const L of S.config.locations.filter(l=>S.calLoc==="all"||l.id===S.calLoc))for(const t of ["a","c"]){const k=`${L.id}|${d}|${t}`;
      const here=weekAssign(w).filter(a=>a.loc===L.id&&a.d===d&&a.t===t).sort((a,b)=>(a.in||"").localeCompare(b.in||""));
      cal.push([DAYS[d],fmtDM(addDays(w,d))+(especial(w,d)?" · "+especial(w,d):""),L.name,TNAME[t],cierre(L.id,d,t),rn(k),nv(k),here.map(a=>`${pname(a.s)} (${puesto(a.loc,a.p)?.name||""}, ${a.in}–${a.out||"cierre"})`).join("; ")])}
    addSheet(wb,"Calendario",cal,[11,13,14,10,8,18,40,80]);
  }
  for(const L of S.config.locations){
    const cols=teamCols(L.id,w);
    const rows=[[`${L.name} · semana del ${fmtDM(w)} al ${fmtDM(addDays(w,6))}`],[],["Día","Fecha","Turno",...cols.map(s=>s.name),"Cierre cocina","Responsable","Novedades del turno"]];
    for(let d=0;d<7;d++)for(const t of ["a","c"]){
      rows.push([DAYS[d],fmtDM(addDays(w,d))+(especial(w,d)?" · "+especial(w,d):""),TNAME[t],...cols.map(s=>{const c=teamCell(s.id,L.id,d,t,w);return c.sub?c.text+" ("+c.sub+")":c.text}),cierre(L.id,d,t),rn(`${L.id}|${d}|${t}`),nv(`${L.id}|${d}|${t}`)]);
    }
    addSheet(wb,"Horario "+L.name,rows,[11,13,10,...cols.map(()=>24),13,18,40]);
  }
  const det=[["Fecha","Día","Turno","Locación","Puesto","Persona","Entrada","Salida","Horas plan.","Entrada real","Salida real","Horas reales","Dom. mediodía o feriado","Nota para la persona","Responsable del turno","Novedades del turno"]];
  weekAssign(w).slice().sort((a,b)=>a.d-b.d||a.t.localeCompare(b.t)||a.loc.localeCompare(b.loc)||(a.in||"").localeCompare(b.in||"")).forEach(a=>{const rh=realHours(a,w),ro=realOf(a,w);
    det.push([addDays(w,a.d),DAYS[a.d],TNAME[a.t],loc(a.loc)?.name||a.loc,puesto(a.loc,a.p)?.name||a.p,pname(a.s),a.in,a.out||cierre(a.loc,a.d,a.t),+hoursOf(a).toFixed(2),ro.in,ro.out,rh==null?"":+rh.toFixed(2),plusPay(w,a)?"Sí":"",a.note||"",rn(`${a.loc}|${a.d}|${a.t}`),nv(`${a.loc}|${a.d}|${a.t}`)])});
  addSheet(wb,"Turnos de la semana",det,[11,10,10,14,20,16,8,8,10,11,11,11,12,28,18,40]);
  const {from,to,rows,byLoc}=hoursData();
  const hs=[[`Horas del ${fmtDM(from)} al ${fmtDM(to)}`],[],["Persona","Horas planificadas","Horas reales","Turnos con horas reales","Horas dom. mediodía y feriado","Turnos","Días","Dobles","Costo ($)"]];
  Object.entries(rows).sort((a,b)=>b[1].plan-a[1].plan).forEach(([id,r])=>hs.push([pname(id),+r.plan.toFixed(2),r.fichados?+r.real.toFixed(2):"",r.fichados,+r.plus.toFixed(2),r.turnos,r.dias,r.dobles,Math.round(r.cost)]));
  hs.push([]);hs.push(["Locación","Horas","Costo ($)"]);
  S.config.locations.forEach(l=>{if(byLoc[l.id])hs.push([l.name,+byLoc[l.id].h.toFixed(2),Math.round(byLoc[l.id].cost)])});
  if(recargo())hs.push([],[`Recargo de domingo al mediodía y feriados: ${recargo()}% (incluido en el costo)`]);
  addSheet(wb,"Horas y costos",hs,[20,18,14,22,22,8,8,8,12]);
  const au=S.ausencias.filter(x=>x.to>=w&&x.from<=addDays(w,6));
  const fw=S.fich.filter(f=>{f._p??=arParts(f.at);return f._p.date>=w&&f._p.date<=addDays(w,6)});
  if(fw.length)addSheet(wb,"Fichadas",[["Fecha","Hora","Persona","Marca","Cómo"],...fw.map(f=>[f._p.date,f._p.hm,pname(f.staff_id),f.tipo==="in"?"Entrada":"Salida",f.origen==="manual"?"A mano ("+(f.por||"")+")":"Fichó"])],[11,7,20,9,24]);
  if(au.length)addSheet(wb,"Ausencias",[["Persona","Tipo","Desde","Hasta","Nota"],...au.map(x=>[pname(x.s),TIPOS[x.tipo],x.from,x.to,x.nota||""])],[18,16,11,11,30]);
  return wb;
}
async function downloadXLSX(){
  if(!window.XLSX){toast("No se pudo cargar el generador de Excel. Recargá la página.");return}
  const data=XLSX.write(buildWorkbook(),{bookType:"xlsx",type:"array"});
  saveFile(`${S.view==="calendario"?"calendario":"turnos"}-osvaldo-${S.week}.xlsx`,new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));toast("Excel descargado")
}

/* ---------- CSV ---------- */
async function downloadCSV(){
  const {from,to}=hoursData();
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[["Fecha","Turno","Persona","Locación","Puesto","Entrada plan.","Salida plan.","Horas plan.","Entrada real","Salida real","Horas reales","Dom. mediodía o feriado","Valor hora","Recargo %","Costo"].join(",")];
  for(const [w,doc] of Object.entries(S.weeks))for(const a of doc.assign||[]){
    const date=addDays(w,a.d);if(date<from||date>to)continue;
    const h=hoursOf(a),rh=realHours(a,w),ro=realOf(a,w);
    lines.push([date,TNAME[a.t],pname(a.s),loc(a.loc)?.name||a.loc,puesto(a.loc,a.p)?.name||a.p,a.in,a.out||cierre(a.loc,a.d,a.t),h.toFixed(2),ro.in,ro.out,rh==null?"":rh.toFixed(2),plusPay(w,a)?"Sí":"",rate(a),plusPay(w,a)?recargo():0,Math.round((rh??h)*rate(a)*(plusPay(w,a)?1+recargo()/100:1))].map(q).join(","));
  }
  saveFile(`horas-${from}-a-${to}.csv`,new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}));toast("CSV descargado")
}

  if(t.id==="miPick"){S.miId=t.value;try{location.hash=t.value?"mi-"+t.value:"mi"}catch{}render();return}
  if(t.id==="tplPick"){S.tplSel=t.value;S.confirm="";render();return}
  if(d.pname||d.parea){const [l,p]=(d.pname||d.parea).split("|");const pu=puesto(l,p);if(!pu||!t.value.trim())return;pu[d.pname?"name":"area"]=t.value.trim();saveConfig();log(`Renombró un puesto de ${loc(l).name}.`);render();return}
  if(d.cierre){const [dd,i]=d.cierre.split("|").map(Number);const c=S.config.cierres[S.loc]??=DEFAULT_CIERRE.map(r=>[...r]);c[dd][i]=t.value;saveConfig();log(`Cambió los cierres de cocina de ${loc(S.loc).name}.`);return}
  if(d.entrada){(S.config.entradas??={})[d.entrada]=t.value;saveConfig();return}
  if(d.cob){const [k,f]=d.cob.split("|");const c=(S.config.cobertura??={})[k]??={};const v=parseInt(t.value,10);if(v>0)c[f]=v;else delete c[f];saveConfig();log(`Cambió la cobertura mínima de ${loc(S.loc).name}.`);return}
  if(d.vh){const v=Number(t.value);(S.config.valorHora??={});if(v>0)S.config.valorHora[d.vh]=v;else delete S.config.valorHora[d.vh];saveConfig();log(`Cambió el valor hora de ${loc(S.loc).name}.`);return}
  if(t.id==="recargo"){S.config.recargo=Math.max(0,Number(t.value)||0);saveConfig();log("Cambió el recargo de domingo al mediodía y feriados.");return}
  if(d.regla){(S.config.reglas??={})[d.regla]=Number(t.value)||0;saveConfig();log("Cambió las reglas de descanso y horas.");return}
  if(d.real){const [id,f]=d.real.split("|");const a=weekAssign(S.week).find(x=>x.id===id);if(!a)return;
    const list=weekAssign(S.week).map(x=>x.id===id?{...x,[f]:t.value}:x);list.forEach(x=>{if(!x.realIn)delete x.realIn;if(!x.realOut)delete x.realOut});
    setWeek(S.week,list);log(`Cargó horas reales de ${pname(a.s)}, ${whenTxt(S.week,a)}.`);render();
    const nx=document.getElementById((f==="realIn"?"ro-":"ri-")+id);if(f==="realIn"&&nx)nx.focus();return}
  if(t.id==="hPreset"){S.hours.preset=t.value;if(t.value==="custom"){S.hours.from=S.week;S.hours.to=addDays(S.week,6)}render();return}
  if(t.id==="hFrom"||t.id==="hTo"){S.hours[t.id==="hFrom"?"from":"to"]=t.value;render();return}
  if(t.id==="cxSel"){S.cx.sel=t.value;S.cx.nin="";render();return}
  if(t.id==="cxTipo"){S.cx.tipo=t.value;render();return}
  if(t.id==="cxPara"){S.cx.para=t.value;S.cx.paraSel="";render();return}
  if(t.id==="cxParaSel"){S.cx.paraSel=t.value;return}
  if(d.rolchg){const email=d.rolchg,rol=t.value;(async()=>{if(S.db){const {error}=await S.db.from("editores").update({rol}).eq("email",email);if(error){toast("No se pudo cambiar: "+error.message);render();return}}
    const x=S.editores.find(e=>e.email===email);if(x)x.rol=rol;log(`Cambió a ${email} a ${rol==="admin"?"administrador":"encargado"}.`);toast("Nivel cambiado")})();return}
  if(t.id==="avisoEmail"){S.config.avisoEmail=t.value.trim();saveConfig();log("Cambió el email de avisos.");return}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="cxMot")S.cx.motivo=t.value;else if(t.id==="cxIn")S.cx.nin=t.value;else if(t.id==="cxOut")S.cx.nout=t.value;else if(t.id==="cxDni")S.cx.dni=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cxDni"){cxGo();return}if(e.key==="Escape"&&S.editing){S.editing=null;renderModal()}});

/* ---------- arranque ---------- */
(function(){const h=(location.hash||"").slice(1);
  if(h.startsWith("mi-")){S.view="mi";S.miId=h.slice(3);S.solo=true}
  else if(h==="fichar"){S.view="fichar";S.solo=true}
  else if(VIEWS.includes(h))S.view=h})();
render();
document.addEventListener("submit",async e=>{
  if(e.target.id!=="loginForm")return;e.preventDefault();
  const email=document.getElementById("lEmail").value.trim(),password=document.getElementById("lPass").value;
  S.editing={type:"login",email,busy:true};renderModal();
  const {error}=await S.db.auth.signInWithPassword({email,password});
  if(error){S.editing={type:"login",email,error:error.message==="Invalid login credentials"?"El email o la contraseña no coinciden.":error.message};renderModal();document.getElementById("lPass")?.focus()}
  else{S.editing=null;toast("Ingresaste")}
});
(function(){
  const sync=document.getElementById("sync");
  const C=window.TURNOS_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||C.supabaseUrl.includes("TU-PROYECTO")){S.canWrite=true;S.isAdmin=true;S.role="admin";S.editores=[{email:"admin@prueba",rol:"admin"}];sync.textContent="Modo de prueba";showBanner("Todavía no está conectada la base de datos: lo que cargues acá no se guarda.");render();return}
  const db=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);S.db=db;
  function applyCache(){
    const cfg=cache.get("config/main");
    if(cfg){const c=structuredClone(cfg);c.cierres??={};c.valorHora=structuredClone(cache.get("privado/costos")?.valorHora||{});c.recargo=Number(cache.get("privado/costos")?.recargo)||0;S.config=c;if(!loc(S.loc))S.loc=c.locations[0]?.id}
    const pre=p=>[...cache].filter(([k])=>k.startsWith(p+"/")).map(([k,v])=>({id:k.slice(p.length+1),...structuredClone(v)}));
    S.staff=pre("staff");
    S.weeks=Object.fromEntries(pre("weeks").map(({id,...v})=>[id,v]));
    S.ausencias=pre("ausencias");
    S.plantillas=pre("plantillas").sort((a,b)=>a.name.localeCompare(b.name,"es"));
    S.hist=Object.fromEntries(pre("historial").map(({id,...v})=>[id,v]));
    if(!S.editing||S.editing.type==="login")render();
  }
  async function loadAll(){
    const {data,error}=await db.from("docs").select("path,data");
    if(error){sync.textContent="Sin conexión";showBanner("No se pudieron cargar los horarios ("+error.message+"). Revisá tu conexión y recargá la página.");return}
    cache.clear();data.forEach(r=>cache.set(r.path,r.data));S.live=true;sync.textContent=S.isAdmin?"Administrador":S.canWrite?"Encargado":"Personal";showBanner("");applyCache();
  }
  async function onSession(session){
    S.session=session;S.me=session?.user?.email||"";S.canWrite=false;S.isAdmin=false;S.role="";
    if(session){let {data,error}=await db.from("editores").select("email,rol").eq("email",S.me.toLowerCase()).maybeSingle();
      if(error){({data}=await db.from("editores").select("email").eq("email",S.me.toLowerCase()).maybeSingle());if(data)data.rol="admin"}
      S.role=data?.rol||"";S.canWrite=!!S.role;S.isAdmin=S.role==="admin";
      if(!S.canWrite)toast("Tu usuario todavía no tiene permiso. Pedile al administrador que te dé acceso.")}
    await loadFichero();await loadAll();
  }
  db.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>onSession(session),0)});
  db.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    if(p.eventType==="DELETE")cache.delete(p.old.path);else cache.set(p.new.path,p.new.data);applyCache();
  }).on("postgres_changes",{event:"*",schema:"public",table:"fichadas"},p=>{
    if(!S.isAdmin)return;
    if(p.eventType==="DELETE")S.fich=S.fich.filter(f=>f.id!==p.old.id);
    else if(p.eventType==="INSERT"&&!S.fich.some(f=>f.id===p.new.id))S.fich=[...S.fich,p.new].sort((a,b)=>a.at.localeCompare(b.at));
    if(!S.editing&&S.view!=="fichar")render();
  }).on("postgres_changes",{event:"*",schema:"public",table:"solicitudes"},p=>{
    if(!S.isAdmin||p.eventType==="DELETE")return;
    S.sol=[p.new,...S.sol.filter(x=>x.id!==p.new.id)].sort((a,b)=>b.created_at.localeCompare(a.created_at));
    if(!S.editing&&!["fichar","cambios"].includes(S.view))render();
  }).subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.live){if(S.view==="fichar")return;loadFichero().then(loadAll)}});
})();
</script>
</body>
